# The eight club archetypes of the Valmere Premier League (docs/design/05-seeding.md section 2).
# Each archetype is assigned to exactly one club, shuffled by the world seed.
# quality: target team rating (mean of the best XI's role ratings) of the club's squad.
# income_m: annual income in millions of crowns; wage_ratio: wage bill as a share of the wage budget
# (above 1.0 = overspending on purpose); wage_budget_share: share of income budgeted for wages.
league:
  name: Valmere Premier League
  short_name: VPL
  first_season_label: "2031/32"
  season_start: "2031-08-15"
  season_end: "2032-05-31"
  min_gap: 18          # best-vs-worst team rating gap must fall in [min_gap, max_gap]
  max_gap: 26
  min_adjacent_gap: 0.5
  calibration_tolerance: 0.6

squad:
  senior_template: {GK: 3, RB: 2, LB: 2, CB: 4, DM: 2, CM: 4, AM: 1, RM: 1, LM: 1, ST: 2, SS: 1, RW: 1, LW: 1}
  youth_positions: [GK, CB, CB, LB, CM, CM, RW, ST]
  age_mean: 26.8
  age_deviation: 4.2
  age_range: [17, 37]
  goalkeeper_age_bonus: 2
  youth_age_range: [16, 19]
  youth_ability: [34, 50]
  starter_noise: 2.5
  second_choice_drop: [3, 7]
  deep_drop: [6, 11]
  free_agents: 30
  free_agent_ability: [35, 60]
  free_agent_age: [20, 36]

shirt_numbers:
  GK: [1, 13, 31]
  RB: [2, 12, 22]
  LB: [3, 14, 23]
  CB: [4, 5, 15, 25]
  DM: [6, 16]
  CM: [8, 18, 20, 28]
  AM: [10]
  RM: [7]
  LM: [11]
  RW: [17]
  LW: [19]
  SS: [21]
  ST: [9, 24]

