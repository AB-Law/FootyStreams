club_suffixes: [United, Athletic, Rovers, Albion, Town, Wanderers, Sporting, Harriers, City, Rangers, County, Argyle]
stadium_suffixes: [Park, Ground, Stadium, Arena, Road, Field, Gardens]
crest_symbols: [stag, lion, anchor, tower, hawk, oak, bridge, wolf, star, ship, key, bull]
crest_decorations: ["three wavy lines", "a crown", "crossed hammers", "a rising sun", "two keys", "a laurel wreath", "a chequered band"]
sponsors: [Orrin Telecom, Valmere Savings, Kestrel Freight, Halden Brewing, Brightwater Energy, Corvane Motors, Lowmoor Dairy, Tessaly Air, Marrow & Dunne, Sablecross Insurance, Pellam Foods, Northgate Steel, Ilvane Bank, Quillon Software, Dovecote Homes, Reedwater Utilities]

