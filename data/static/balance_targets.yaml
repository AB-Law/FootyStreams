# Balance targets: what "a good league" looks like, read by `uv run balance` and the statistical tests.
#
# Each metric has a target, an acceptable band [min, max], a loss weight and a tier:
#   fast: asserted in the default test run (200 matches, band widened by FAST_BAND_FACTOR)
#   slow: asserted only by the 1,200-match run (nightly, and before milestones close)
# The numbers are recollections of long-run averages for elite men's top-flight football, not a
# dataset (docs/design/02 section 14). Edit any band, or add a profile; nothing else hard-codes them.
# A profile with `extends` takes every metric of that profile and replaces the ones it lists.

profiles:
  realistic:
    description: Typical elite top-flight football; the default profile.
    metrics:
      goals_per_match: {target: 2.70, min: 2.45, max: 2.95, weight: 3, tier: fast}
      home_goals_per_match: {target: 1.50, min: 1.35, max: 1.65, weight: 1, tier: fast}
      away_goals_per_match: {target: 1.20, min: 1.05, max: 1.35, weight: 1, tier: fast}
      home_goal_share_pct: {target: 55.5, min: 53, max: 58, weight: 1, tier: slow}
      home_win_pct: {target: 45, min: 41, max: 49, weight: 2, tier: fast}
      draw_pct: {target: 25, min: 22, max: 29, weight: 2, tier: fast}
      away_win_pct: {target: 30, min: 26, max: 34, weight: 2, tier: fast}
      scoreless_pct: {target: 7.5, min: 6, max: 9, weight: 1, tier: slow}
      five_plus_goals_pct: {target: 4, min: 0, max: 7, weight: 1, tier: slow}
      team_five_plus_pct: {target: 1, min: 0, max: 2, weight: 1, tier: slow}
      second_half_goal_share_pct: {target: 55.5, min: 53, max: 58, weight: 1, tier: slow}
      late_goal_share_pct: {target: 25, min: 22, max: 28, weight: 1, tier: slow}
      shots_per_team: {target: 12.5, min: 11, max: 14, weight: 2, tier: fast}
      on_target_per_shot: {target: 0.365, min: 0.33, max: 0.40, weight: 1, tier: fast}
      goals_per_shot_pct: {target: 10.5, min: 9, max: 12, weight: 2, tier: fast}
      pass_completion_pct: {target: 80, min: 75, max: 86, weight: 2, tier: fast}
      possession_spread_pp: {target: 8, min: 6, max: 10, weight: 1, tier: slow}
      corners_per_match: {target: 10, min: 9, max: 11.5, weight: 1, tier: fast}
      offsides_per_match: {target: 3.8, min: 3.0, max: 5.0, weight: 1, tier: fast}
      fouls_per_match: {target: 22, min: 19, max: 26, weight: 1, tier: fast}
      yellows_per_match: {target: 3.6, min: 3.0, max: 4.4, weight: 2, tier: fast}
      reds_per_match: {target: 0.11, min: 0.07, max: 0.16, weight: 2, tier: slow}
      penalties_per_match: {target: 0.27, min: 0.20, max: 0.35, weight: 1, tier: slow}
      penalty_conversion_pct: {target: 77, min: 74, max: 80, weight: 1, tier: slow}
      injuries_per_match: {target: 0.40, min: 0.25, max: 0.60, weight: 1, tier: slow}
      substitutions_per_team: {target: 4.2, min: 3.5, max: 4.9, weight: 1, tier: slow}
      early_tactical_subs_per_match: {target: 0, min: 0, max: 0.05, weight: 1, tier: slow}
      added_time_first_half_min: {target: 1.8, min: 0.8, max: 2.8, weight: 1, tier: slow}
      added_time_second_half_min: {target: 4.2, min: 3.2, max: 5.2, weight: 1, tier: slow}
      favourite_win_pct_even: {target: 38.5, min: 35, max: 42, weight: 1, tier: slow}
      draw_pct_even: {target: 27, min: 24, max: 30, weight: 1, tier: slow}
      underdog_win_pct_even: {target: 36.5, min: 33, max: 40, weight: 1, tier: slow}
      favourite_win_pct_small: {target: 48.5, min: 44, max: 53, weight: 1, tier: slow}
      draw_pct_small: {target: 27, min: 24, max: 30, weight: 1, tier: slow}
      underdog_win_pct_small: {target: 25, min: 20, max: 30, weight: 1, tier: slow}
      favourite_win_pct_medium: {target: 60.5, min: 55, max: 66, weight: 1, tier: slow}
      draw_pct_medium: {target: 23, min: 19, max: 27, weight: 1, tier: slow}
      underdog_win_pct_medium: {target: 16, min: 11, max: 21, weight: 1, tier: slow}
      favourite_win_pct_large: {target: 73, min: 66, max: 80, weight: 1, tier: slow}
      draw_pct_large: {target: 18.5, min: 14, max: 23, weight: 1, tier: slow}
      underdog_win_pct_large: {target: 9.5, min: 5, max: 14, weight: 1, tier: slow}
      home_favourite_edge_pp: {target: 8.5, min: 5, max: 12, weight: 1, tier: slow}
      favourite_win_rises_with_gap: {target: 1, min: 1, max: 1, weight: 1, tier: slow}

  high_scoring:
    description: Open games with more goals and shots.
    extends: realistic
    metrics:
      goals_per_match: {target: 3.30, min: 3.0, max: 3.6, weight: 3, tier: fast}
      home_goals_per_match: {target: 1.80, min: 1.6, max: 2.0, weight: 1, tier: fast}
      away_goals_per_match: {target: 1.50, min: 1.3, max: 1.7, weight: 1, tier: fast}
      shots_per_team: {target: 15, min: 13.5, max: 16.5, weight: 2, tier: fast}
      scoreless_pct: {target: 4, min: 2.5, max: 6, weight: 1, tier: slow}
      five_plus_goals_pct: {target: 12, min: 6, max: 20, weight: 1, tier: slow}
      team_five_plus_pct: {target: 4, min: 1, max: 8, weight: 1, tier: slow}

  defensive_grind:
    description: Tight, low-scoring games with many draws.
    extends: realistic
    metrics:
      goals_per_match: {target: 2.15, min: 1.9, max: 2.4, weight: 3, tier: fast}
      home_goals_per_match: {target: 1.20, min: 1.05, max: 1.35, weight: 1, tier: fast}
      away_goals_per_match: {target: 0.95, min: 0.8, max: 1.1, weight: 1, tier: fast}
      shots_per_team: {target: 10.5, min: 9.5, max: 11.5, weight: 2, tier: fast}
      draw_pct: {target: 30, min: 26, max: 34, weight: 2, tier: fast}
      home_win_pct: {target: 40, min: 36, max: 44, weight: 2, tier: fast}
      away_win_pct: {target: 30, min: 26, max: 34, weight: 2, tier: fast}
      scoreless_pct: {target: 11, min: 9, max: 14, weight: 1, tier: slow}
      five_plus_goals_pct: {target: 2, min: 0, max: 4, weight: 1, tier: slow}

  chaos:
    description: More cards, injuries and upsets for entertainment.
    extends: realistic
    metrics:
      yellows_per_match: {target: 4.6, min: 4.0, max: 5.2, weight: 2, tier: fast}
      reds_per_match: {target: 0.25, min: 0.18, max: 0.35, weight: 2, tier: slow}
      injuries_per_match: {target: 0.70, min: 0.5, max: 0.9, weight: 1, tier: slow}
      favourite_win_pct_large: {target: 62, min: 52, max: 72, weight: 1, tier: slow}
      underdog_win_pct_large: {target: 16, min: 8, max: 24, weight: 1, tier: slow}
      underdog_win_pct_medium: {target: 24, min: 17, max: 31, weight: 1, tier: slow}
      favourite_win_pct_medium: {target: 52, min: 45, max: 59, weight: 1, tier: slow}
