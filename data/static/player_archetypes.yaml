# Player archetypes: attribute biases relative to a player's overall level, so profiles are spiky
# (strong where the archetype demands, weak elsewhere) rather than flat noise around a mean.
# roles: "<role base id>:<duty>" the archetype is at home in (resolved to ids by the generator).
# height / bmi: [mean, deviation]. weight: relative frequency among archetypes of the position.
latent:
  factor_deviation: 9.0   # spread of each latent factor (athleticism, technique, football_iq)
  noise_deviation: 7.0    # independent per-attribute noise
  loadings:
    athleticism: {pace: 1.0, acceleration: 1.0, stamina: 0.8, strength: 0.6, agility: 0.8, balance: 0.5, jumping_reach: 0.7, natural_fitness: 0.6, work_rate: 0.3}
    technique: {first_touch: 1.0, dribbling: 1.0, short_passing: 0.8, long_passing: 0.7, crossing: 0.6, finishing: 0.5, ball_shielding: 0.5, set_piece_delivery: 0.6, long_shots: 0.5, flair: 0.5, penalty_taking: 0.4}
    football_iq: {vision: 1.0, decisions: 1.0, anticipation: 0.9, positioning: 0.8, off_ball_movement: 0.6, composure: 0.7, concentration: 0.7, teamwork: 0.5, marking: 0.3, tackling: 0.2}

position_bias:
  GK: {finishing: -45, long_shots: -40, dribbling: -40, crossing: -35, heading: -30, tackling: -45, marking: -45, set_piece_delivery: -30, penalty_taking: -30, ball_shielding: -30, first_touch: -15, short_passing: -10, long_passing: -8, off_ball_movement: -35, flair: -20, pace: -20, acceleration: -15, stamina: -10, work_rate: -10}
  CB: {finishing: -25, long_shots: -20, dribbling: -12, crossing: -15, flair: -12, off_ball_movement: -15, vision: -6, set_piece_delivery: -10, penalty_taking: -15, tackling: 6, marking: 6, heading: 8, positioning: 5, strength: 6, jumping_reach: 6, bravery: 4, pace: -4}
  RB: &fullback {finishing: -20, long_shots: -10, heading: -8, crossing: 2, tackling: 2, stamina: 6, pace: 5, work_rate: 6, strength: -4, flair: -4, penalty_taking: -10}
  LB: *fullback
  RWB: *fullback
  LWB: *fullback
  DM: {finishing: -15, long_shots: -8, crossing: -8, dribbling: -6, tackling: 6, positioning: 5, anticipation: 4, work_rate: 5, stamina: 3}
  CM: {finishing: -8, heading: -6, short_passing: 4, vision: 2, stamina: 3, work_rate: 3}
  AM: {heading: -14, tackling: -18, marking: -18, strength: -10, stamina: -4, vision: 5, first_touch: 5, dribbling: 4, flair: 6, short_passing: 4}
  SS: {tackling: -18, marking: -16, heading: -6, first_touch: 4, off_ball_movement: 6, finishing: 4}
  RM: &wide {finishing: -8, heading: -10, tackling: -8, marking: -10, crossing: 6, pace: 4, stamina: 4}
  LM: *wide
  RW: &winger {heading: -14, tackling: -18, marking: -18, strength: -10, crossing: 4, dribbling: 6, pace: 6, acceleration: 4, flair: 4}
  LW: *winger
  ST: {tackling: -20, marking: -20, positioning: -6, finishing: 8, heading: 2, composure: 3, off_ball_movement: 6, long_passing: -10, crossing: -8}

