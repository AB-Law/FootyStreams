# League-layer tunables: calendar, money, attendance, recovery and world events.
# Everything here is read by pure league code through LeagueConfig (loaded by the composition root).
calendar:
  season_start: [8, 15]
  season_end: [5, 31]
  matchday_spacing_days: 21        # 14 matchdays x 21 days fits one in-world year with the off-season
  midseason_window_after_matchday: 7
  midseason_window_days: 14
  summer_window_open: [6, 15]
  summer_window_close: [8, 14]
  contract_end: [6, 30]

finance:
  weeks_per_year: 52
  home_matches_per_season: 7
  hospitality_share_of_gate: 0.18
  merchandise_per_fan_per_season: 14
  merchandise_form_weight: 0.3        # share of merchandise that follows results (win share)
  facilities_upkeep_per_level_week: 450
  youth_academy_per_level_week: 160
  prize_pool_share_of_income: 0.10     # of the league's total yearly income, paid by final position
  prize_position_decay: 0.78           # each place earns this share of the one above
  broadcast_merit_share: 0.2           # share of broadcast income paid as merit by final position

attendance:
  base_fill: 0.62
  reputation_weight: 0.30
  form_weight: 0.10
  derby_bonus: 0.12
  bad_weather_penalty: 0.08
  fickleness_weight: 0.5               # how strongly form moves attendance for fickle fanbases
  noise: 0.04
  minimum_fill: 0.25

weather:
  rain_temperature_limit: 3            # below this temperature rain becomes snow
  hot_threshold: 28
  cold_threshold: 2
  kickoff_hours: [15, 17, 20]
  night_hour: 19
  temperature_noise: 3.0
  wind_noise: 2.0

recovery:
  fatigue_rest_day: 0.10
  fatigue_training_day: 0.05
  fitness_gain_rest_day: 0.004
  sharpness_decay_idle_day: 0.012
  sharpness_gain_per_match: 0.12
  morale_drift_per_day: 0.01
  morale_win: 0.04
  morale_loss: -0.05
  form_weight_new_rating: 0.3          # exponential moving average weight of the latest match rating
  injury_day_per_medical_level: 0.003  # shortens healing by this share per medical level point
  suspension_yellow_threshold: 5
  fatigue_per_match_minute: 0.0035
  rotation_fatigue_threshold: 0.55
  rotation_ability_margin: 5

world_events:
  daily_hazard: 0.006                  # base chance per player per day of a life event
  volatility_weight: 0.5
  media_weight: 0.5
  kind_weights:
    media_storm: 3
    manager_row: 2
    personal_turmoil: 2
    family_matter: 1
    dressing_room_row: 2
    fan_abuse: 1
    homesickness: 1
  duration_days: [10, 35]
  magnitude: [0.25, 0.8]
