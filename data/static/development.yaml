# Player development (docs/design/07 section 4). Curves are expected attribute points per year at
# the given age (the first row whose age bound is >= the player's age applies).
progression:
  headroom_reference: 20          # CA headroom at which growth runs at full speed
  micro_share: 0.30               # share of a year's growth applied as weekly training micro-steps
  noise: 0.45                     # std-dev of the yearly noise on each attribute (points)
  default_playing_time: 0.8       # used by micro-steps; season-end uses the real minutes share
  full_playing_time_minutes: 0.6  # share of available minutes that counts as a full season
  training_floor: 0.4             # growth factor is floor + (1 - floor) * training quality
  playing_time_floor: 0.7         # growth factor is floor + (1 - floor) * playing time
  facility_weight: 0.5            # training quality: facility level vs the coaching staff
  professionalism_weight: 0.20
  development_rate_weight: 0.60
  fitness_decline_weight: 0.50    # natural fitness slows (or speeds) physical decline
  injury_setback_max: 3           # physical points a severe injury can cost
  curves:
    technical:
      growth: [[18, 6.4], [21, 5.1], [24, 3.5], [28, 1.6], [30, 0.5], [99, 0.0]]
      decline: [[30, 0.0], [33, 0.5], [36, 1.2], [99, 2.0]]
    mental:
      growth: [[18, 4.8], [21, 4.2], [25, 3.2], [30, 1.9], [33, 0.8], [99, 0.0]]
      decline: [[33, 0.0], [36, 0.4], [99, 0.9]]
    physical:
      growth: [[18, 8.0], [21, 5.6], [24, 2.4], [26, 0.5], [99, 0.0]]
      decline: [[27, 0.0], [29, 0.6], [32, 1.4], [35, 2.4], [99, 3.4]]
    goalkeeping:
      growth: [[20, 4.8], [25, 3.2], [30, 1.6], [99, 0.0]]
      decline: [[33, 0.0], [36, 0.6], [99, 1.5]]

potential:
  min_age: 17
  max_age: 23
  chance: 0.08                    # yearly chance of a potential revision
  up: [3, 8]
  down: [3, 8]

positions:
  retrain_gain_per_year: 8        # competence points when the player is retrained to a position
  unused_decay_per_year: 1        # secondary positions fade slowly when unused
  role_familiarity_gain_per_year: 4

retirement:
  hazard: [[31, 0.0], [32, 0.03], [33, 0.08], [34, 0.16], [35, 0.28], [36, 0.45], [37, 0.65], [99, 0.85]]
  ability_weight: 0.008           # hazard grows by this per CA point below the league mean
  min_hazard_multiplier: 0.5

youth:
  intake_age: [16, 18]
  ability_fraction: 0.62          # intake current ability as a share of the league senior mean
  potential_bonus_base: 6
  potential_bonus_per_quality: 14 # extra potential bonus at intake_quality 1.0
  contract_years: 3
  promotion_age: 18
  max_age: 21                     # prospects not promoted by this age are released
  promotion_margin: 6             # promoted when his value is within this of the squad's weakest senior
  potential_weight: 0.4           # value = ability + this x (potential - ability)
  wage_weekly: 600

squad:
  min_senior: 22
  max_senior: 28
  min_goalkeepers: 2
  trialist_contract_years: 1
  free_agent_pool: 20             # the pool is topped up with journeymen to at least this many
  free_agent_pool_max: 40         # the weakest unsigned players beyond this many leave the game
  journeyman_age: [24, 31]
  journeyman_ability_fraction: 0.85

rollover:
  reputation_step: 1.2            # club reputation points per place above (below) its expected place
  reputation_max_change: 3
  player_reputation_pull: 0.2     # share of the gap to the ability-based target closed each year
  player_reputation_ability_weight: 0.7
  fanbase_drift: 0.03             # fan base change per unit of (expected - final) / (clubs - 1)
  confidence_step: 0.10           # board confidence per unit of (expected - final) / (clubs - 1)
  sponsor_years: [1, 3]
  sponsor_reputation_growth: 0.01 # sponsor value change per club reputation point gained
  wage_budget_ratio: 0.62         # of the income estimate
  wage_tolerance: 0.10            # renewals are scaled down while the bill exceeds the budget by more
  wage_scale_max: 1.25            # and up (to this) while the bill is well under the budget
  transfer_budget_share: 0.30     # of a positive balance
  contract_extend_years: [1, 3]
  awards_min_appearances: 6
