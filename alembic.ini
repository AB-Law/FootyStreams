# Alembic configuration. The database URL is supplied by the caller (footystreams.persistence.sql.migrate
# or `alembic -x url=sqlite:///league.sqlite ...`); nothing here points at a real database.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
