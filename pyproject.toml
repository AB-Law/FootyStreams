[project]
name = "footystreams"
version = "0.0.1"
description = "A fictional football league that runs as a 24/7 live broadcast: deterministic match simulation, event stream and league world."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footystreams"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
# Markdown (design docs, rules, fragments) is prose, not code to lint or reformat.
extend-exclude = ["docs", "changes", ".claude", ".cursor", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "RUF", "PL", "PT", "S",
    "D", "FBT", "BLE", "TRY", "PERF", "ARG", "ERA", "PTH", "RET", "TID",
]
ignore = [
    "D203", "D213",  # conflicting docstring-style pairs; Google convention is used instead
    "TRY003",        # long exception messages are fine when they carry ids and context
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 30
max-branches = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ARG", "FBT"]
"tools/**" = ["T20"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
files = ["src", "tests", "tools"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: long-running test, excluded from the fast tier",
]
