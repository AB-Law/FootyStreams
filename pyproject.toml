[project]
name = "footystreams"
version = "0.0.1"
description = "A fictional football league that runs as a 24/7 live broadcast: deterministic match simulation, event stream and league world."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
seed = "footystreams.cli.seed:main"
check = "footystreams.tools.check:main"
changelog = "footystreams.tools.changelog.cli:main"
commit-msg-check = "footystreams.tools.commitmsg:main"
pr-size = "footystreams.tools.prsize:main"
export-schemas = "footystreams.cli.export_schemas:main"
sim = "footystreams.cli.sim:main"
golden = "footystreams.cli.golden:main"
league = "footystreams.cli.league:main"
balance = "footystreams.cli.balance:main"
engine = "footystreams.cli.engine:main"
narrate = "footystreams.cli.narrate:main"
channel = "footystreams.cli.channel:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footystreams"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src"]
# Markdown (design docs, rules, fragments) is prose, not code to lint or reformat.
extend-exclude = ["docs", "changes", ".claude", ".cursor", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "RUF", "PL", "PT", "S",
    "D", "FBT", "BLE", "TRY", "PERF", "ARG", "ERA", "PTH", "RET", "TID",
]
ignore = [
    "D203", "D213",  # conflicting docstring-style pairs; Google convention is used instead
    "TRY003",        # long exception messages are fine when they carry ids and context
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 30
max-branches = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ARG", "FBT"]
"tools/**" = ["T20"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]
mypy_path = "src,."
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests may not touch the network (loopback only); order is randomised; each test has a time limit.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib --disable-socket --allow-hosts=127.0.0.1,::1"
timeout = 30
markers = [
    "slow: long-running test, excluded from the fast tier",
    "statistical: balance/statistics tests over many simulated matches",
    "soak: multi-season endurance tests",
    "chaos: fault-injection tests",
    "golden: pinned-output regression tests",
    "perf: performance budget tests",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["footystreams"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '\.\.\.$']
